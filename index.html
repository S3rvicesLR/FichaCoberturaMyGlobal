<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Ficha My Global</title>
    <!-- Librería html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Librerías de Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-panel: #ffffff;
            --text-main: #1f2937;
            --border-color: #d1d5db;
            --input-bg: #f9fafb;
            --header-title: #003399;
            --box-bg: #e0f2fe;
            --box-border: #0284c7;
            --box-text: #0369a1;
            --preview-bg: #e5e7eb;
            --calc-bg: #eff6ff;
            --calc-border: #93c5fd;
            --calc-text: #1e40af;
        }

        body.dark-mode {
            --bg-body: #111827;
            --bg-panel: #1f2937;
            --text-main: #f3f4f6;
            --border-color: #374151;
            --input-bg: #374151;
            --header-title: #60a5fa;
            --box-bg: #1e293b;
            --box-border: #38bdf8;
            --box-text: #38bdf8;
            --preview-bg: #111827;
            --calc-bg: #1e293b;
            --calc-border: #3b82f6;
            --calc-text: #93c5fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .app-container { display: flex; width: 100vw; height: 100vh; }

        .controls-panel {
            width: 420px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .header-title { font-size: 1.2rem; font-weight: 700; color: var(--header-title); }
        .product-selector-box { background: var(--box-bg); border: 2px solid var(--box-border); padding: 10px; border-radius: 8px; }
        .product-selector-box label { color: var(--box-text); font-weight: 800; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        input, select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; background-color: var(--input-bg); color: var(--text-main);
        }
        input:focus, select:focus { outline: none; border-color: #0072bc; }

        .calculated-box {
            background-color: var(--calc-bg); border: 1px dashed var(--calc-border); padding: 8px 10px; border-radius: 6px; font-size: 0.88rem; font-weight: 700; color: var(--calc-text);
        }

        .button-group { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn {
            padding: 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background-color: #0072bc; color: white; }
        .btn-primary:hover { background-color: #005a96; }
        .btn-drive { background-color: #059669; color: white; }
        .btn-drive:hover { background-color: #047857; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-reset { background-color: #6b7280; color: white; }
        .btn-dark-mode { background-color: #4b5563; color: white; }
        .btn-dark-mode:hover { background-color: #374151; }

        .preview-panel { flex: 1; background: var(--preview-bg); display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; }
        .canvas-wrapper { box-shadow: 0 12px 30px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; background: #fff; }

        #image-container {
            position: relative;
            width: 500px;
            height: 755px;
            background: #ffffff;
        }

        #bg-template-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .overlay-field {
            position: absolute; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            color: #0f2b5c; 
            text-align: center;
            z-index: 2;
        }

        /* --- POSICIONES PLAN TIPO 1: DENTAL / VISIÓN --- */
        .mode-dental #val-nombre { top: 239.5px; left: 167.6px; width: 178px; height: 26px; font-size: 14px; }
        .mode-dental #val-poliza { top: 296.2px; left: 309.8px; width: 166px; height: 26px; font-size: 14px; }
        .mode-dental #val-activo-dental { top: 296.1px; left: 56.7px; width: 166px; height: 26px; font-size: 15px; }
        .mode-dental #val-prima { top: 399.7px; left: 49.6px; width: 170px; height: 26px; font-size: 16px; }
        .mode-dental #val-cobertura-tipo { top: 451.6px; left: 53.3px; width: 170px; height: 26px; font-size: 14px; }
        .mode-dental #val-cobertura-anual { top: 506.5px; left: 53.3px; width: 170px; height: 26px; font-size: 16px; }
        .mode-dental #val-deducible { top: 393.5px; left: 299.3px; width: 170px; height: 26px; font-size: 16px; }
        .mode-dental #val-activo-vision { top: 635px; left: 58.2px; width: 180px; height: 26px; font-size: 15px; color: #713f12; display: flex !important; }

        /* --- POSICIONES PLAN TIPO 2: ACCIDENTE --- */
        .mode-accidente #val-nombre { top: 192.9px; left: 82px; width: 350px; height: 26px; font-size: 14px; justify-content: center; }
        .mode-accidente #val-poliza { top: 245.3px; left: 74.4px; width: 150px; height: 26px; font-size: 14px; justify-content: center; }
        .mode-accidente #val-activo-dental { top: 243px; left: 318.2px; width: 150px; height: 26px; font-size: 14px; justify-content: center; }
        .mode-accidente #val-prima { top: 303.1px; left: 74.4px; width: 150px; height: 26px; font-size: 14px; justify-content: center; }
        .mode-accidente #val-cobertura-tipo { top: 303.1px; left: 318.2px; width: 150px; height: 26px; font-size: 13px; justify-content: center; }
        .mode-accidente #val-cobertura-anual,
        .mode-accidente #val-deducible,
        .mode-accidente #val-activo-vision { display: none !important; }

        @media print {
            body { background: none !important; height: auto !important; overflow: visible !important; }
            .controls-panel { display: none !important; }
            .preview-panel { padding: 0 !important; margin: 0 !important; background: none !important; display: block !important; }
            .canvas-wrapper { box-shadow: none !important; border-radius: 0 !important; }
            #image-container { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page {
                size: 500px 755px;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls-panel">
        <div class="header-container">
            <h2 class="header-title">Generador de Fichas</h2>
            <button class="btn btn-dark-mode" onclick="toggleDarkMode()" id="btnDarkModeToggle">🌙 Modo Oscuro</button>
        </div>

        <div class="form-group product-selector-box">
            <label for="selectProducto">Seleccionar Producto:</label>
            <select id="selectProducto" onchange="switchProduct()">
                <option value="dental">Dental / Visión</option>
                <option value="accidente">Accidente</option>
            </select>
        </div>

        <div class="form-group">
            <label for="inputNombre">1. Nombre y Apellidos:</label>
            <input type="text" id="inputNombre" placeholder="Escribir nombre completo" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputPoliza">2. ID Póliza:</label>
            <input type="text" id="inputPoliza" placeholder="Ej: POL-123456" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputFechaDental" id="labelFechaInicial">3. Activo a partir de (MM/DD/YYYY):</label>
            <input type="text" id="inputFechaDental" placeholder="MM/DD/YYYY" oninput="handleDateChange()" onpaste="setTimeout(handleDateChange, 50)">
        </div>

        <div class="form-group">
            <label for="inputPrima">4. Prima Mensual:</label>
            <input type="text" id="inputPrima" placeholder="Ej: $50" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="selectTipo">5. Tipo de Cobertura:</label>
            <select id="selectTipo" onchange="updatePreview()">
                <option value="">-- SELECCIONAR --</option>
                <option value="INDIVIDUAL">INDIVIDUAL</option>
                <option value="FAMILIAR">FAMILIAR</option>
                <option value="EN PAREJA">EN PAREJA</option>
                <option value="PADRE E HIJO">PADRE E HIJO</option>
            </select>
        </div>

        <div class="form-group dental-only">
            <label for="selectAnual">6. Cobertura Anual Aprobada:</label>
            <select id="selectAnual" onchange="updatePreview()">
                <option value="">-- Seleccionar --</option>
                <option value="$1,000">$1,000</option>
                <option value="$1,500">$1,500</option>
                <option value="$2,000">$2,000</option>
                <option value="$2,500">$2,500</option>
                <option value="$3,000">$3,000</option>
                <option value="$3,500">$3,500</option>
                <option value="$4,000">$4,000</option>
                <option value="$4,500">$4,500</option>
                <option value="$5,000">$5,000</option>
            </select>
        </div>

        <div class="form-group dental-only">
            <label for="selectDeducible">7. Monto del Deducible:</label>
            <select id="selectDeducible" onchange="updatePreview()">
                <option value="">-- Seleccionar --</option>
                <option value="$0">$0</option>
                <option value="$50">$50</option>
                <option value="$100">$100</option>
            </select>
        </div>

        <div class="form-group dental-only">
            <label>8. Activo a partir de (Visión - +6 Meses):</label>
            <div id="calculatedVisionDate" class="calculated-box">Ingrese la fecha inicial arriba</div>
        </div>

        <div class="button-group">
            <button class="btn btn-drive" onclick="subirAGoogleDrive()">☁️ Guardar en Google Drive</button>
            <button class="btn btn-primary" onclick="downloadImage()">🖼️ Descargar Ficha</button>
            <button class="btn btn-success" onclick="imprimirPlantilla()">🖨️ Guardar PDF / Imprimir</button>
            <button class="btn btn-reset" onclick="resetAndNext()">🔄 Siguiente Cliente (Limpiar)</button>
        </div>
    </div>

    <div class="preview-panel">
        <div class="canvas-wrapper">
            <div id="image-container" class="mode-dental">
                <img id="bg-template-img" src="ficha_myglobal.png" alt="Plantilla Base">
                
                <div id="val-nombre" class="overlay-field"></div>
                <div id="val-poliza" class="overlay-field"></div>
                <div id="val-activo-dental" class="overlay-field"></div>
                <div id="val-prima" class="overlay-field"></div>
                <div id="val-cobertura-tipo" class="overlay-field"></div>
                <div id="val-cobertura-anual" class="overlay-field"></div>
                <div id="val-deducible" class="overlay-field"></div>
                <div id="val-activo-vision" class="overlay-field"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = '200321082265-o73as5jo6ho4aj618p495eji2obdt4e6.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyDebntoFWjqv6m2QR8Y1OkoRIb3UWHusdQ';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    const FOLDER_IDS = {
      accidente: '1ulOP3iO80iuMA9XdZdVXduws-0U93R7C',
      dental: '1zIndIvzJRQWKVrG6UPSFX0hqA1-wyurD'
    };

    let tokenClient;
    let accessToken = null;

    function initGoogleClient() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    accessToken = tokenResponse.access_token;
                    ejecutarSubidaADrive();
                } else {
                    alert('No se pudo obtener el permiso para acceder a Google Drive.');
                }
            },
        });
    }

    window.onload = () => {
        let checkGsi = setInterval(() => {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
                clearInterval(checkGsi);
                initGoogleClient();
            }
        }, 300);
    };

    function subirAGoogleDrive() {
        if (!tokenClient) {
            alert('Las librerías de Google aún no han cargado. Intenta nuevamente en 3 segundos.');
            return;
        }

        if (!accessToken) {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        } else {
            ejecutarSubidaADrive();
        }
    }

    async function ejecutarSubidaADrive() {
        const element = document.getElementById('image-container');
        const nombre = document.getElementById('inputNombre').value || "Cliente";
        const prod = document.getElementById('selectProducto').value;

        html2canvas(element, {
            scale: 4,
            useCORS: true,
            allowTaint: true,
            logging: false,
            width: 500,
            height: 755
        }).then(canvas => {
            canvas.toBlob(async (blob) => {
                const folderId = FOLDER_IDS[prod] || FOLDER_IDS['accidente'];
                const nombreArchivo = `Ficha_${prod}_${nombre.replace(/\s+/g, '_')}.png`;

                const metadata = {
                    name: nombreArchivo,
                    mimeType: 'image/png',
                    parents: [folderId]
                };

                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', blob);

                try {
                    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                        body: form
                    });

                    const resData = await response.json();
                    if (resData.id) {
                        alert(`¡Ficha guardada exitosamente en Google Drive dentro de la carpeta: ${prod.toUpperCase()}!`);
                    } else if (resData.error && resData.error.code === 401) {
                        accessToken = null;
                        tokenClient.requestAccessToken({ prompt: '' });
                    } else {
                        alert('Ocurrió un error al subir el archivo a Google Drive.');
                        console.error(resData);
                    }
                } catch (err) {
                    console.error('Error en la subida:', err);
                    alert('Error de red al conectar con Google Drive.');
                }
            }, 'image/png');
        });
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('btnDarkModeToggle');
        if (document.body.classList.contains('dark-mode')) {
            btn.innerText = '☀️ Modo Claro';
        } else {
            btn.innerText = '🌙 Modo Oscuro';
        }
    }

    function formatDateMMDDYYYY(date) {
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const year = date.getFullYear();
        return `${month}/${day}/${year}`;
    }

    function parseInputDate(str) {
        if (!str) return null;
        str = str.trim();
        let parts = [];
        
        if (str.includes('/')) {
            parts = str.split('/');
        } else if (str.includes('-')) {
            parts = str.split('-');
        }

        if (parts.length === 3) {
            let m, d, y;
            if (parts[0].length === 4) {
                y = parseInt(parts[0], 10);
                m = parseInt(parts[1], 10) - 1;
                d = parseInt(parts[2], 10);
            } else {
                m = parseInt(parts[0], 10) - 1;
                d = parseInt(parts[1], 10);
                y = parseInt(parts[2], 10);
            }

            const parsedDate = new Date(y, m, d);
            if (!isNaN(parsedDate.getTime())) {
                return parsedDate;
            }
        }
        return null;
    }

    function switchProduct() {
        const prod = document.getElementById('selectProducto').value;
        const container = document.getElementById('image-container');
        const bgImg = document.getElementById('bg-template-img');
        const dentalFields = document.querySelectorAll('.dental-only');

        if (prod === 'accidente') {
            container.className = 'mode-accidente';
            bgImg.src = 'ficha_accidente.png';
            dentalFields.forEach(el => el.style.display = 'none');
            document.getElementById('labelFechaInicial').innerText = '3. Activo a partir de (MM/DD/YYYY):';
        } else {
            container.className = 'mode-dental';
            bgImg.src = 'ficha_myglobal.png';
            dentalFields.forEach(el => el.style.display = 'flex');
            document.getElementById('labelFechaInicial').innerText = '3. Activo a partir de (Dental - MM/DD/YYYY):';
        }
        handleDateChange();
        updatePreview();
    }

    function handleDateChange() {
        const inputVal = document.getElementById('inputFechaDental').value;
        const prod = document.getElementById('selectProducto').value;
        const parsedDate = parseInputDate(inputVal);

        if (parsedDate) {
            const formattedDate = formatDateMMDDYYYY(parsedDate);
            document.getElementById('val-activo-dental').innerText = formattedDate;

            if (prod === 'dental') {
                const visionDate = new Date(parsedDate.getFullYear(), parsedDate.getMonth() + 6, parsedDate.getDate());
                const visionFormatted = formatDateMMDDYYYY(visionDate);
                document.getElementById('calculatedVisionDate').innerText = visionFormatted;
                document.getElementById('val-activo-vision').innerText = visionFormatted;
            } else {
                document.getElementById('val-activo-vision').innerText = "";
            }
        } else {
            document.getElementById('val-activo-dental').innerText = inputVal;
            document.getElementById('calculatedVisionDate').innerText = "Ingrese una fecha válida arriba";
            document.getElementById('val-activo-vision').innerText = inputVal;
        }
    }

    function updatePreview() {
        document.getElementById('val-nombre').innerText = document.getElementById('inputNombre').value;
        document.getElementById('val-poliza').innerText = document.getElementById('inputPoliza').value;
        document.getElementById('val-prima').innerText = document.getElementById('inputPrima').value;
        document.getElementById('val-cobertura-tipo').innerText = document.getElementById('selectTipo').value;
        document.getElementById('val-cobertura-anual').innerText = document.getElementById('selectAnual').value;
        document.getElementById('val-deducible').innerText = document.getElementById('selectDeducible').value;
    }

    function downloadImage() {
        const element = document.getElementById('image-container');
        const nombre = document.getElementById('inputNombre').value || "Cliente";
        const prod = document.getElementById('selectProducto').value;

        html2canvas(element, {
            scale: 4,
            useCORS: true,
            allowTaint: true,
            logging: false,
            width: 500,
            height: 755
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Ficha_${prod}_${nombre.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });
    }

    function imprimirPlantilla() {
        window.print();
    }

    function resetAndNext() {
        document.getElementById('inputNombre').value = "";
        document.getElementById('inputPoliza').value = "";
        document.getElementById('inputFechaDental').value = "";
        document.getElementById('inputPrima').value = "";
        document.getElementById('selectTipo').value = "";
        document.getElementById('selectAnual').value = "";
        document.getElementById('selectDeducible').value = "";
        document.getElementById('calculatedVisionDate').innerText = "Ingrese la fecha inicial arriba";

        document.getElementById('val-nombre').innerText = "";
        document.getElementById('val-poliza').innerText = "";
        document.getElementById('val-activo-dental').innerText = "";
        document.getElementById('val-prima').innerText = "";
        document.getElementById('val-cobertura-tipo').innerText = "";
        document.getElementById('val-cobertura-anual').innerText = "";
        document.getElementById('val-deducible').innerText = "";
        document.getElementById('val-activo-vision').innerText = "";
    }
</script>

</body>
</html>
